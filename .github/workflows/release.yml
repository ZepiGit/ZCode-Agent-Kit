# Stable releases run on main pushes, version tags and manual dispatch. Feature
# branch dispatches/pushes run the same test matrix and create an isolated
# GitHub prerelease (without npm publication). Both paths build release assets
# (git-archive tarball + installers + checksums).
#
# npm auth is OIDC-based Trusted Publishing (no NPM_TOKEN secret, immune to
# the account's 2FA policy): the runner exchanges a GitHub OIDC token with the
# registry. Prerequisite configured once on npmjs.com: package Settings →
# Trusted Publisher → ZepiGit/ZCode-Agent-Kit + workflow `release.yml`.
# Requires npm >= 11.5 (installed in the publish job; Node 20 ships npm 10).
#
# Why a tag push instead of the `release` event: GitHub delivered the
# ReleaseEvent for v0.2.0/v0.2.1 but never started the release-triggered
# workflow (zero runs with event=release) — a tag push is the reliable signal.
# The release below is created with GITHUB_TOKEN, whose events do not trigger
# other workflows (no double publish). `workflow_dispatch` re-runs the stable
# build + verify + publish path from main, or the isolated prerelease path when
# dispatched on `feature/account-rotator`.
name: release

on:
  push:
    branches: ["main", "feature/account-rotator"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The proxy + MCP bridge suites need bun (their vendored toolchain).
      # Pinned to the version the test evidence was produced with (1.4.2);
      # older bun (e.g. 1.2.20) rejects the mcp bridge's lockfileVersion 2.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install bridge/proxy dependencies
        run: |
          cd zcode-proxy-src && bun install --frozen-lockfile
          cd ../mcp/zcode-harness-mcp && bun install --frozen-lockfile
      - name: Kit tests (node:test)
        run: npm run test
      - name: Proxy tests (bun test)
        run: npm run test:proxy
      - name: MCP bridge tests
        run: npm run test:mcp

  release-and-publish:
    # Generated account-rotator tags are prereleases. Keep even a manually
    # pushed copy of one out of the stable npm publishing path.
    if: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && !contains(github.ref_name, '-account-rotator.') }}
    permissions:
      contents: write
      id-token: write
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The publish job alone runs on Node 24: Trusted Publishing (OIDC)
      # needs npm >= 11.5, which is installed below. The test matrix above
      # intentionally stays on Node 20 (the documented engines floor).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      # Trusted Publishing (OIDC) needs npm >= 11.5; Node 24 ships npm 11.3.
      # npm@11 supports Node 24; npm@12 would need >= 22.22 / 24.15 / 26.
      - name: Upgrade npm for OIDC trusted publishing
        run: |
          npm install -g npm@11.19.1
          npm --version
      # AUTO-RELEASE POLICY (owner request): every run on main (push or
      # workflow_dispatch) must produce a NEW release number. If the checked-out
      # package.json version is on npm or its remote tag points to another
      # commit, select an unused patch, update ALLOW_PUBLISH, commit + tag.
      # Never publish changed code under a tag whose assets already exist.
      # An unpublished exact-HEAD retry keeps its version and existing assets.
      # Tag pushes keep the classic gated path below.
      - name: Resolve release version (avoid occupied npm versions and tags)
        run: |
          CUR=$(node -p "require('./package.json').version")
          NEW="$CUR"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            NEW=$(node scripts/registry-version.mjs resolve "$CUR")
          fi
          if [ "$NEW" != "$CUR" ]; then
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$NEW';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
            node -e "const fs=require('fs');const l=JSON.parse(fs.readFileSync('package-lock.json','utf8'));l.version='$NEW';if(l.packages&&l.packages[''])l.packages[''].version='$NEW';fs.writeFileSync('package-lock.json',JSON.stringify(l,null,2)+'\n')"
            echo "$NEW" > pack/ALLOW_PUBLISH
            git config user.name "zcode-kit release bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json pack/ALLOW_PUBLISH
            git commit -m "chore(release): v$NEW (auto-bump by release workflow) [skip ci]"
            git tag "v$NEW"
            # The bump commit and its tag must land together: an interleaved
            # main push previously rejected HEAD:main while the tag still went
            # through, leaving an orphan tag with no release or npm version.
            # Push atomically; if main moved ahead, rebase the version-only
            # bump and retry a bounded number of times.
            PUSHED=0
            for attempt in 1 2 3; do
              if git push --atomic origin HEAD:main "v$NEW"; then PUSHED=1; break; fi
              echo "push attempt $attempt rejected; rebasing onto origin/main"
              git fetch origin main
              git rebase origin/main || break
              git tag -f "v$NEW" HEAD
            done
            if [ "$PUSHED" != "1" ]; then
              echo "release push failed after retries; no remote tag was left behind"
              exit 1
            fi
            echo "VERSION=$NEW" >> "$GITHUB_ENV"
            echo "auto-bumped $CUR -> $NEW"
          else
            echo "VERSION=$CUR" >> "$GITHUB_ENV"
            echo "using package.json version $CUR as-is"
          fi
      # Classic tag pushes only: if that tag's version is already on npm there
      # is nothing to publish — skip keeps the run green instead of dying on
      # the registry's version-conflict check. After an auto-bump this is 0.
      - name: Determine whether this version is already published
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(node scripts/registry-version.mjs check "$VERSION")
          if [ "$PUBLISHED" = "present" ]; then
            echo "SKIP_PUBLISH=1" >> "$GITHUB_ENV"
            echo "zcode-agent-kit@$VERSION is already published — publish steps will be skipped."
          else
            echo "SKIP_PUBLISH=0" >> "$GITHUB_ENV"
            echo "zcode-agent-kit@$VERSION is not on npm yet — publish will proceed."
          fi
      # Version-bound gate on every run: tag (classic) or the resolved release
      # tag (auto path), package.json and ALLOW_PUBLISH must all agree
      # (ZAK-013: assets must never disagree about what they are).
      - name: Gate release tag against package version and publish marker
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v$VERSION"; fi
          VERSION=$(node -p "require('./package.json').version")
          echo "release tag=$TAG version=$VERSION"
          [ "v$VERSION" = "$TAG" ] || { echo "tag $TAG does not match package.json $VERSION"; exit 1; }
          grep -qx "$VERSION" pack/ALLOW_PUBLISH || { echo "pack/ALLOW_PUBLISH does not allow $VERSION"; exit 1; }
      - name: Assemble launcher package
        run: node pack/build.mjs --tracked-only
      - name: Verify package payload (no secrets, no vendored trees)
        run: node pack/verify-payload.mjs
      - name: Dry-run publish (fails on payload problems, publishes nothing)
        if: env.SKIP_PUBLISH != '1'
        run: node pack/build.mjs --tracked-only --dry-run-publish
      - name: Build release assets (git-archive tarball, installers, checksums)
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v$VERSION"; fi
          VERSION="${TAG#v}"
          mkdir -p release
          git archive --format=tar.gz --prefix="zcode-agent-kit-$VERSION/" -o "release/v$VERSION.tar.gz" HEAD
          cp install.ps1 install.sh release/
          (cd release && sha256sum "v$VERSION.tar.gz" install.ps1 install.sh > checksums.txt)
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v$VERSION"; fi
          VERSION="${TAG#v}"
          # Idempotent: a retry (dispatch or a later main push auto-releasing
          # the same version) must reach the npm publish step instead of dying
          # on an already-existing release. ZAK-013: never replace assets
          # under an existing tag — keep it as-is.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — keeping it, continuing to publish"
            exit 0
          fi
          ASSETS="release/v$VERSION.tar.gz release/install.ps1 release/install.sh release/checksums.txt"
          if [ -f "docs/RELEASE_NOTES_${TAG}.md" ]; then
            gh release create "$TAG" $ASSETS --target "$(git rev-parse HEAD)" --title "zcode-agent-kit $TAG" --notes-file "docs/RELEASE_NOTES_${TAG}.md"
          else
            gh release create "$TAG" $ASSETS --target "$(git rev-parse HEAD)" --title "zcode-agent-kit $TAG" --generate-notes
          fi
      - name: Publish to npm via OIDC trusted publishing
        if: env.SKIP_PUBLISH != '1'
        run: |
          cd pack/dist
          # The registry occasionally answers publishes with transient 5xx
          # (maintenance windows). Retry a bounded number of times before
          # failing so short outages do not require a manual rerun.
          PUBLISHED=0
          for attempt in 1 2 3; do
            if npm publish --provenance; then PUBLISHED=1; break; fi
            echo "npm publish attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then sleep 60; fi
          done
          [ "$PUBLISHED" = "1" ] || exit 1
      - name: Verify exact published version is visible on npm
        if: env.SKIP_PUBLISH != '1'
        timeout-minutes: 3
        run: node scripts/registry-version.mjs verify "$VERSION"

  # Feature validation is deliberately a separate path: it never mutates or
  # pushes main, never publishes to npm, and creates a non-latest prerelease.
  # The metadata edits below are staged into a throwaway index before creating
  # the source archive. `git archive HEAD` would silently omit those edits.
  feature-account-rotator-prerelease:
    if: ${{ github.ref == 'refs/heads/feature/account-rotator' }}
    permissions:
      contents: write
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare exact prerelease metadata
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          BASE_VERSION=$(node -p "require('./package.json').version")
          VERSION="${BASE_VERSION}-account-rotator.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          TAG="v${VERSION}"
          node - "$VERSION" <<'NODE'
          const fs = require('node:fs');
          const version = process.argv[2];
          const packageFile = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageFile.version = version;
          fs.writeFileSync('package.json', JSON.stringify(packageFile, null, 2) + '\n');
          const lockFile = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lockFile.version = version;
          if (lockFile.packages?.['']) lockFile.packages[''].version = version;
          fs.writeFileSync('package-lock.json', JSON.stringify(lockFile, null, 2) + '\n');
          NODE
          printf '%s\n' "$VERSION" > pack/ALLOW_PUBLISH
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Assemble and validate prerelease package
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./package-lock.json').version")" = "$VERSION"
          grep -Fxq "$VERSION" pack/ALLOW_PUBLISH
          node pack/build.mjs --tracked-only
          node pack/verify-payload.mjs
          node - "$VERSION" <<'NODE'
          const fs = require('node:fs');
          const version = process.argv[2];
          const pkg = JSON.parse(fs.readFileSync('pack/dist/package.json', 'utf8'));
          if (pkg.version !== version || pkg.private || !pkg.files.includes('ALLOW_PUBLISH')) {
            throw new Error(`invalid prerelease package metadata: ${JSON.stringify(pkg)}`);
          }
          NODE
          (cd pack/dist && npm pack --dry-run --ignore-scripts)
      - name: Build versioned prerelease assets
        run: |
          set -euo pipefail
          mkdir -p release
          INDEX_FILE=$(mktemp)
          trap 'rm -f "$INDEX_FILE"' EXIT
          rm -f "$INDEX_FILE"
          GIT_INDEX_FILE="$INDEX_FILE" git read-tree HEAD
          GIT_INDEX_FILE="$INDEX_FILE" git add package.json package-lock.json pack/ALLOW_PUBLISH
          # The normal archive policy excludes all of pack/. Keep the
          # version-bound marker in this release tree without changing the
          # repository's export policy for ordinary source archives.
          ATTR_BLOB=$({ cat .gitattributes; printf '\n/pack/ALLOW_PUBLISH -export-ignore\n'; } | git hash-object -w --stdin)
          GIT_INDEX_FILE="$INDEX_FILE" git update-index --add --cacheinfo "100644,$ATTR_BLOB,.gitattributes"
          TREE=$(GIT_INDEX_FILE="$INDEX_FILE" git write-tree)
          git archive --format=tar.gz --prefix="zcode-agent-kit-${VERSION}/" -o "release/${TAG}.tar.gz" "$TREE"
          cp install.ps1 install.sh release/
          (cd release && sha256sum "${TAG}.tar.gz" install.ps1 install.sh > checksums.txt)
          # The archive must contain the exact metadata used to validate the
          # package, including the marker that prevents version drift.
          tar -xOzf "release/${TAG}.tar.gz" "zcode-agent-kit-${VERSION}/package.json" \
            | node -e 'const fs=require("node:fs"); const expected=process.argv[1]; const pkg=JSON.parse(fs.readFileSync(0,"utf8")); if(pkg.version!==expected) throw new Error("archive package.json version mismatch");' "$VERSION"
          tar -xOzf "release/${TAG}.tar.gz" "zcode-agent-kit-${VERSION}/pack/ALLOW_PUBLISH" \
            | grep -Fxq "$VERSION"
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; keeping its immutable assets"
            exit 0
          fi
          gh release create "$TAG" \
            "release/${TAG}.tar.gz" release/install.ps1 release/install.sh release/checksums.txt \
            --target "$SOURCE_SHA" \
            --title "zcode-agent-kit $TAG" \
            --prerelease --latest=false \
            --generate-notes
