# Release pipeline: pushing a vX.Y.Z tag is the single trigger for an
# automatic release. It runs the full test matrix, builds the release assets
# (git-archive tarball + installers + checksums), creates the GitHub release
# and publishes the launcher package to npm.
#
# npm auth is OIDC-based Trusted Publishing (no NPM_TOKEN secret, immune to
# the account's 2FA policy): the runner exchanges a GitHub OIDC token with the
# registry. Prerequisite configured once on npmjs.com: package Settings →
# Trusted Publisher → ZepiGit/ZCode-Agent-Kit + workflow `release.yml`.
# Requires npm >= 11.5 (installed in the publish job; Node 20 ships npm 10).
#
# Why a tag push instead of the `release` event: GitHub delivered the
# ReleaseEvent for v0.2.0/v0.2.1 but never started the release-triggered
# workflow (zero runs with event=release) — a tag push is the reliable signal.
# The release below is created with GITHUB_TOKEN, whose events do not trigger
# other workflows (no double publish). `workflow_dispatch` re-runs the build +
# verify + publish path from main — the re-publish lever after a failed step.
name: release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The proxy + MCP bridge suites need bun (their vendored toolchain).
      # Pinned to the version the test evidence was produced with (1.4.2);
      # older bun (e.g. 1.2.20) rejects the mcp bridge's lockfileVersion 2.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install bridge/proxy dependencies
        run: |
          cd zcode-proxy-src && bun install --frozen-lockfile
          cd ../mcp/zcode-harness-mcp && bun install --frozen-lockfile
      - name: Kit tests (node:test)
        run: npm run test
      - name: Proxy tests (bun test)
        run: npm run test:proxy
      - name: MCP bridge tests
        run: npm run test:mcp

  release-and-publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The publish job alone runs on Node 24: Trusted Publishing (OIDC)
      # needs npm >= 11.5, which is installed below. The test matrix above
      # intentionally stays on Node 20 (the documented engines floor).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      # Trusted Publishing (OIDC) needs npm >= 11.5; Node 24 ships npm 11.3.
      # npm@11 supports Node 24; npm@12 would need >= 22.22 / 24.15 / 26.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11
      # AUTO-RELEASE POLICY (owner request): every run on main (push or
      # workflow_dispatch) must produce a NEW release number. If the checked-out
      # package.json version is already on npm, bump the patch version, update
      # ALLOW_PUBLISH, commit + tag — this same job then builds assets and
      # publishes that exact version. A package.json version not yet on npm is
      # released as-is. Tag pushes keep the classic gated path below.
      - name: Resolve release version (auto-bump patch when already published)
        run: |
          CUR=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && npm view "zcode-agent-kit@$CUR" version >/dev/null 2>&1; then
            NEW=$(node -e "const s='$CUR'.split('.'); s[2]=Number(s[2])+1; console.log(s.join('.'))")
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$NEW';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
            node -e "const fs=require('fs');const l=JSON.parse(fs.readFileSync('package-lock.json','utf8'));l.version='$NEW';if(l.packages&&l.packages[''])l.packages[''].version='$NEW';fs.writeFileSync('package-lock.json',JSON.stringify(l,null,2)+'\n')"
            echo "$NEW" > pack/ALLOW_PUBLISH
            git config user.name "zcode-kit release bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json pack/ALLOW_PUBLISH
            git commit -m "chore(release): v$NEW (auto-bump by release workflow) [skip ci]"
            git tag "v$NEW"
            git push origin HEAD:"${GITHUB_REF_NAME#refs/heads/}" "v$NEW"
            echo "VERSION=$NEW" >> "$GITHUB_ENV"
            echo "auto-bumped $CUR -> $NEW"
          else
            echo "VERSION=$CUR" >> "$GITHUB_ENV"
            echo "using package.json version $CUR as-is"
          fi
      # Classic tag pushes only: if that tag's version is already on npm there
      # is nothing to publish — skip keeps the run green instead of dying on
      # the registry's version-conflict check. After an auto-bump this is 0.
      - name: Determine whether this version is already published
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "zcode-agent-kit@$VERSION" version >/dev/null 2>&1; then
            echo "SKIP_PUBLISH=1" >> "$GITHUB_ENV"
            echo "zcode-agent-kit@$VERSION is already published — publish steps will be skipped."
          else
            echo "SKIP_PUBLISH=0" >> "$GITHUB_ENV"
            echo "zcode-agent-kit@$VERSION is not on npm yet — publish will proceed."
          fi
      # Version-bound gate on every run: tag (classic) or the resolved release
      # tag (auto path), package.json and ALLOW_PUBLISH must all agree
      # (ZAK-013: assets must never disagree about what they are).
      - name: Gate release tag against package version and publish marker
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v$VERSION"; fi
          VERSION=$(node -p "require('./package.json').version")
          echo "release tag=$TAG version=$VERSION"
          [ "v$VERSION" = "$TAG" ] || { echo "tag $TAG does not match package.json $VERSION"; exit 1; }
          grep -qx "$VERSION" pack/ALLOW_PUBLISH || { echo "pack/ALLOW_PUBLISH does not allow $VERSION"; exit 1; }
      - name: Assemble launcher package
        run: node pack/build.mjs
      - name: Verify package payload (no secrets, no vendored trees)
        run: node pack/verify-payload.mjs
      - name: Dry-run publish (fails on payload problems, publishes nothing)
        if: env.SKIP_PUBLISH != '1'
        run: node pack/build.mjs --dry-run-publish
      - name: Build release assets (git-archive tarball, installers, checksums)
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v$VERSION"; fi
          VERSION="${TAG#v}"
          mkdir -p release
          git archive --format=tar.gz --prefix="zcode-agent-kit-$VERSION/" -o "release/v$VERSION.tar.gz" HEAD
          cp install.ps1 install.sh release/
          (cd release && sha256sum "v$VERSION.tar.gz" install.ps1 install.sh > checksums.txt)
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v$VERSION"; fi
          VERSION="${TAG#v}"
          ASSETS="release/v$VERSION.tar.gz release/install.ps1 release/install.sh release/checksums.txt"
          if [ -f "docs/RELEASE_NOTES_${TAG}.md" ]; then
            gh release create "$TAG" $ASSETS --title "zcode-agent-kit $TAG" --notes-file "docs/RELEASE_NOTES_${TAG}.md"
          else
            gh release create "$TAG" $ASSETS --title "zcode-agent-kit $TAG" --generate-notes
          fi
      - name: Publish to npm via OIDC trusted publishing
        if: env.SKIP_PUBLISH != '1'
        run: cd pack/dist && npm publish --provenance
