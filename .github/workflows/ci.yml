# CI: run the kit's test suites on push and pull requests.
# The npm-publish workflow reuses `npm run test` before any publication step.
name: ci

on:
  push:
    branches: [main, feature/account-rotator]
  pull_request:

permissions:
  contents: read

jobs:
  test-kit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Support floor 24 (ADR-0006) and the current Active LTS 26.
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # The proxy + MCP bridge suites need bun (their vendored toolchain).
      # Pinned to 1.4.2 everywhere (Rounds 10–11: Bun >= 1.4.3 raises the
      # S1/burst1 proxy peak on the CI runners; ticket 62 owns re-entry);
      # older bun (e.g. 1.2.20) rejects the mcp bridge's lockfileVersion 2.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install bridge/proxy dependencies
        run: |
          cd zcode-proxy-src && bun install --frozen-lockfile
          cd ../mcp/zcode-harness-mcp && bun install --frozen-lockfile
      - name: Kit tests (node:test)
        run: npm run test
      - name: Proxy tests (bun test)
        run: npm run test:proxy
      # Through the proxy's pinned devDependencies (typescript 7.0.2,
      # @types/bun 1.4.2), never a by-name runner that fetches typescript@latest.
      # The baseline has no errors, so any type error fails the leg.
      - name: Proxy typecheck (pinned tsc)
        run: npm run test:proxy-typecheck
      - name: MCP bridge tests
        run: npm run test:mcp

  # Before-equivalence (ticket 06): every captured CLI output is byte-identical
  # to the BEFORE baseline, the proof of "no visible change" for tickets 06–08
  # (tests/ux-before-equivalence.test.mjs). ubuntu: all seven variants against
  # tests/ux-before/linux. windows: the pipe and ci variants; until
  # tests/ux-before/windows is committed, the baseline is captured on the same
  # runner from the ticket-06 base commit and uploaded for committing.
  ux-before:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install proxy dependencies
        run: cd zcode-proxy-src && bun install --frozen-lockfile
      - name: Windows baseline from the base commit (until tests/ux-before/windows is committed)
        if: runner.os == 'Windows' && hashFiles('tests/ux-before/windows/manifest.json') == ''
        # pwsh, the same shell as the equivalence step: the baseline and the
        # fresh capture must run in the same environment (a bash step leaks
        # MSYS state and puts the raw mingw64 git.exe first on PATH).
        shell: pwsh
        run: |
          $base = (Get-Content tests/ux-before/windows-base-commit -Raw).Trim()
          $kit = Join-Path $env:RUNNER_TEMP "ux-base"
          $out = Join-Path $env:RUNNER_TEMP "ux-before-windows"
          git worktree add --detach $kit $base
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location (Join-Path $kit "zcode-proxy-src")
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          node tests/ux-before/capture/capture.mjs --kit $kit --variants pipe,ci --out $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "UX_BEFORE_BASELINE=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Upload the Windows baseline (to commit as tests/ux-before/windows)
        if: runner.os == 'Windows' && env.UX_BEFORE_BASELINE != ''
        uses: actions/upload-artifact@v7
        with:
          name: ux-before-windows-baseline
          path: ${{ env.UX_BEFORE_BASELINE }}
          retention-days: 14
      - name: Before-equivalence (byte for byte)
        env:
          UX_BEFORE_OUT: ${{ runner.temp }}/ux-before-now
        run: npm run test:ux-before
      - name: Upload the fresh capture (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ux-before-now-${{ runner.os }}
          path: ${{ runner.temp }}/ux-before-now
          if-no-files-found: ignore
          retention-days: 14

  # Memory loop (tests/memory), short profile, with the expected-RED ratchet
  # (tests/memory/expected-red.json, keyed per OS leg): every run listed there
  # must be RED, every other run GREEN. ubuntu runs S1–S7, each run in a
  # systemd user scope with MemoryMax (verified) or prlimit, plus a timeout;
  # windows runs S1, S2 (offline fixture), S3, S4, S5 and S7 with the Windows
  # sampler (commit charge), each run in a Job Object with a job memory limit
  # and kill-on-close (read back before the run), plus a timeout
  # (tests/memory/job.mjs, lib/caps.mjs).
  memory-budget:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 150 || 75 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # Disposable runner: the only place the loop may run without run-capped.sh.
      ZCODE_MEMLOOP_ALLOW: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Paired Bun measurement (Round 10 Q1 condition 1; ticket 62's re-entry
      # tool, Round 11 Q1 condition 4), only with the measurement marker: the
      # candidate Bun versions 1.4.3 and 1.4.4 through setup-bun (the same
      # release-asset endpoint as the job's own Bun), each copied aside and
      # checked by its --revision. The job's own Bun (the pinned 1.4.2) is the
      # reference arm. setup-bun always installs to ~/.bun/bin, so the job's
      # own Bun comes last and stays the one on PATH; no-cache keeps the post
      # step from caching that last binary under these versions. A new
      # candidate gets its own pair of steps here (ticket 62).
      - name: Bun 1.4.3 for the paired measurement
        id: bun-143
        if: hashFiles('tests/memory/measure-burst1') != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
          no-cache: true
      - name: Keep Bun 1.4.3 aside
        if: hashFiles('tests/memory/measure-burst1') != ''
        shell: bash
        run: node tests/memory/lib/keep-bun-arm.mjs "${{ steps.bun-143.outputs.bun-path }}" 1.4.3 "${{ runner.temp }}/bun-arms"
      - name: Bun 1.4.4 for the paired measurement
        id: bun-144
        if: hashFiles('tests/memory/measure-burst1') != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          no-cache: true
      - name: Keep Bun 1.4.4 aside
        if: hashFiles('tests/memory/measure-burst1') != ''
        shell: bash
        run: node tests/memory/lib/keep-bun-arm.mjs "${{ steps.bun-144.outputs.bun-path }}" 1.4.4 "${{ runner.temp }}/bun-arms"
      # The pinned Bun (Rounds 10–11: 1.4.2 everywhere).
      - uses: oven-sh/setup-bun@v2
        id: bun-job
        with:
          bun-version: 1.4.2
      - name: Keep Bun 1.4.2 aside
        if: hashFiles('tests/memory/measure-burst1') != ''
        shell: bash
        run: node tests/memory/lib/keep-bun-arm.mjs "${{ steps.bun-job.outputs.bun-path }}" 1.4.2 "${{ runner.temp }}/bun-arms"
      - name: Install bridge/proxy dependencies
        run: |
          cd zcode-proxy-src && bun install --frozen-lockfile
          cd ../mcp/zcode-harness-mcp && bun install --frozen-lockfile
      # A measurement run (Round 8 Q1 condition 2, ticket 60) replaces the
      # ratchet with N fresh S1/burst1 runs. It is on only while the one-run
      # marker tests/memory/measure-burst1 is committed on the branch under
      # test; a test fails while it exists, so it never merges. Its content:
      # "N" (N runs on the job's Bun) or "N bun=1.4.2,1.4.3,1.4.4" (the paired
      # measurement: N runs per arm, interleaved in rotation, Round 10 Q1; the
      # pinned Bun first, as the reference arm). Each arm named in the marker
      # must have been kept aside above. The S1/stalled attribution (ticket 61,
      # Round 12 Q3 condition 1) is the same kind of one-run switch: while
      # tests/memory/measure-stalled (content "N") is committed, the ratchet is
      # replaced by N rotations of S1/stalled and its drained reference.
      # The S2 CDN cache A/B (ticket 80, Owner Proxy round 31 Q1, stage 1) is
      # another such switch: while tests/memory/measure-cdn is committed
      # (content "N", "N ABAB" or "N BABA"), the ratchet is replaced by N
      # rotations of full S2/short runs whose phase D uses head's
      # CaptchaCdnCache (A) or the verbatim pre-29 cache (B). A re-run attempt
      # with an even number reverses the marker's order.
      - name: Memory loop (short profile) and expected-RED ratchet
        if: hashFiles('tests/memory/measure-burst1') == '' && hashFiles('tests/memory/measure-stalled') == '' && hashFiles('tests/memory/measure-cdn') == ''
        run: node tests/memory/job.mjs --out "${{ runner.temp }}/memloop"
      - name: S1/stalled attribution (only with the tests/memory/measure-stalled marker)
        if: hashFiles('tests/memory/measure-burst1') == '' && hashFiles('tests/memory/measure-stalled') != '' && hashFiles('tests/memory/measure-cdn') == ''
        shell: bash
        run: node tests/memory/job.mjs --measure-stalled "$(tr -d '\r' < tests/memory/measure-stalled)" --out "${{ runner.temp }}/memloop"
      - name: S2 CDN cache A/B (only with the tests/memory/measure-cdn marker)
        if: hashFiles('tests/memory/measure-burst1') == '' && hashFiles('tests/memory/measure-stalled') == '' && hashFiles('tests/memory/measure-cdn') != ''
        shell: bash
        run: node tests/memory/job.mjs --measure-cdn "$(tr -d '\r' < tests/memory/measure-cdn)" --out "${{ runner.temp }}/memloop"
      - name: S1/burst1 measurement (only with the tests/memory/measure-burst1 marker)
        if: hashFiles('tests/memory/measure-burst1') != ''
        shell: bash
        run: |
          ARMS="${{ runner.temp }}/bun-arms"
          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          SPEC="$(tr -d '\r' < tests/memory/measure-burst1)"
          if grep -q 'bun=' tests/memory/measure-burst1; then
            BUNS=""
            for v in $(printf '%s' "${SPEC#*bun=}" | tr ',' ' '); do BUNS="${BUNS:+$BUNS,}$v=$ARMS/$v/bun$EXE"; done
            node tests/memory/job.mjs --measure-burst1 "$SPEC" --bun "$BUNS" --out "${{ runner.temp }}/memloop"
          else
            node tests/memory/job.mjs --measure-burst1 "$(cat tests/memory/measure-burst1)" --out "${{ runner.temp }}/memloop"
          fi
      - name: Upload memory loop artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: memory-budget-${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}
          path: |
            ${{ runner.temp }}/memloop/job-summary.json
            ${{ runner.temp }}/memloop/job-summary.md
            ${{ runner.temp }}/memloop/measure-S1-burst1.json
            ${{ runner.temp }}/memloop/measure-S1-burst1.md
            ${{ runner.temp }}/memloop/measure-S1-stalled.json
            ${{ runner.temp }}/memloop/measure-S1-stalled.md
            ${{ runner.temp }}/memloop/measure-S2-cdn.json
            ${{ runner.temp }}/memloop/measure-S2-cdn.md
            ${{ runner.temp }}/memloop/**/run.log
            ${{ runner.temp }}/memloop/**/samples.csv
            ${{ runner.temp }}/memloop/**/summary.json
            ${{ runner.temp }}/memloop/**/worker-heap.jsonl
          if-no-files-found: warn
          retention-days: 14
