# zcode-proxy configuration template.
# setup.mjs copies this to config.yaml and injects a generated proxyApiKey
# (also written to <clone>/.proxykey, which harness configs reference).
server:
  port: 8457
  host: "127.0.0.1"
  # Admission control (optional): cap on the request-body bytes the proxy
  # holds at once, in MB (default 64, allowed 1-4096). Requests beyond it wait
  # unread in a FIFO (at most 64 waiting, at most 15 s), then get HTTP 503 with
  # Retry-After in their endpoint's error shape, never 429. An idle proxy always
  # admits one request. Open response streams are never limited.
  # Env override: ZCODE_PROXY_ADMISSION_MAX_INFLIGHT_MB.
  # admission:
  #   maxInFlightMB: 64
auth:
  # Key clients must provide; setup.mjs replaces GENERATE_ME with a random key.
  proxyApiKey: "GENERATE_ME"
  # Optional encrypted account pool for automatic free/start-plan quota rotation.
  # Disabled by default. The pool defaults to ~/.zcode-proxy/accounts.json (0600).
  accounts:
    enabled: false
    # path: "~/.zcode-proxy/accounts.json"
    # allowedIds: ["privat", "arbeit"]
    # pausedIds: []
    # allowPaid: false
    # allowedOrigins: ["http://localhost:8457"]
provider: zai
plan: start-plan
providers:
  zai:
    anthropicBase: "https://api.z.ai/api/anthropic"
    openaiBase: "https://api.z.ai/api/coding/paas/v4"
  bigmodel:
    anthropicBase: "https://open.bigmodel.cn/api/anthropic"
    openaiBase: "https://open.bigmodel.cn/api/coding/paas/v4"
defaultModel: glm-5.3
models:
  - glm-5.3
  - glm-5.3-flash
identity:
  appVersion: "3.14.3"
  sourceTitle: "cli"
  refererOrigin: "https://zcode.z.ai"
  # Generated once at first `auth login` (stable device identity).
  deviceMid: ""
# Responses API (OpenAI Agents SDK / wire_api=responses clients).
responses:
  enabled: true
  store:
    maxEntries: 1000
    ttlMs: 86400000
# Builder Event token auto-claim is enabled for authenticated sessions. The
# scheduler stays idle until a JWT is available and polls the same preview
# endpoint used by the Claim button.
claim:
  enabled: true
  auto: true
  origin: "https://zcode.z.ai"
  pollIntervalMs: 300000
  cooldownMs: 600000
  # Empty prefers Builder Event tokens, then highest-priority campaigns.
  planId: ""

# Off-peak queue deliberately disabled.
# Optional CAPTCHA egress proxy (only for CAPTCHA requests; ambient
# HTTP_PROXY/HTTPS_PROXY variables are ignored):
#   ZCODE_PROXY_UPSTREAM_PROXY=http://proxy.example:8080
async:
  enabled: false
endpointRouting:
  enabled: true
clientSigning:
  enabled: false
logging:
  level: info

# Health supervisor (optional): samples the proxy's memory footprint
# (Pss on Linux, commit charge on Windows; RSS where neither is available).
# Soft limit: WARN event line only. Hard limit: asks the kit manager for a
# respawn (budget 3 per 15 min) and drains only once the manager has
# acknowledged it (reserved the budget, within 10 s): requests already
# accepted finish, new ones get 503 + Retry-After. A refused or
# unacknowledged respawn keeps the proxy serving: one ERROR line, restarts
# exhausted, no new request until the 15 min window has passed. Without the
# kit manager (TUI, standalone proxy) it only logs and keeps serving. Each limit must be
# held for "samples" samples taken "sampleIntervalSeconds" apart.
# Defaults shown; no env override.
# health:
#   memory:
#     softLimitMB: 512           # 64-65536
#     hardLimitMB: 1024          # 64-65536, above softLimitMB
#     samples: 3                 # 1-20
#     sampleIntervalSeconds: 15  # 1-600

# Captcha solver process (optional): the solver runs in a process of its own
# under a memory cap, in MB. The cap counts the memory the solver uses. Linux
# enforces it with a systemd user scope (cgroup) once its limit has been read
# back from the kernel. Elsewhere the solver process measures its own
# footprint and ends itself at the cap: on macOS, on a Linux without a
# delegated memory controller, and on Windows, where a Job Object can only
# limit commit charge and stops the solver 1024 MB above the cap. A solver
# that ends at the cap is logged with this key's name. Raise the cap only if
# solves need more memory. A solve peaks at about 250 MB, so a cap under 300
# leaves it no room.
# The solver process is replaced by a fresh one at 50 % of the cap or after
# 100 solves. One that ends abnormally (a crash, the cap, a fatal error, a
# solve over 90 s) fails only the solve that was running. After more than 5
# such exits in 10 minutes, requests that need a solve get HTTP 503 with
# Retry-After until the oldest of those exits is 10 minutes old.
# Default shown; allowed 128-65536; no env override.
# solver:
#   memoryCapMB: 300
